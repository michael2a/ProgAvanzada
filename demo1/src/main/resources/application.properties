spring.application.name=demo1

# 1. Servidor
server.port=8080
server.servlet.context-path=/

# 2. Logging
logging.level.root=INFO
logging.level.org.example.demo1=DEBUG

# 3. Bases de datos / JSON
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/inventario}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

# 4. Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# 5. Seguridad
spring.security.user.name=admin
spring.security.user.password=admin123

# App Info Properties
app.info.name=Gestor de Inventario
app.info.version=@project.version@
app.info.environment=dev
app.info.developer=Michael
app.info.email=michael@example.com